publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  cupertino_icons: ^1.0.8
  dio: ^5.5.0
  equatable: ^2.0.5
  fl_chart: ^0.66.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.0.0
  flutter_contacts: ^1.1.9
  flutter_bloc: ^8.1.6
  flutter_local_notifications: ^17.2.0
  flutter_localizations:
    sdk: flutter
  flutter_map: ^6.1.0
  flutter_secure_storage: ^10.0.0
  geolocator: ^11.0.0
  go_router: ^14.2.0
  google_fonts: ^6.2.1
  google_sign_in: ^6.2.1
  googleapis: ^13.0.0
  googleapis_auth: ^1.6.0
  http: ^1.2.0
  intl: ^0.20.1
  latlong2: ^0.9.1
  local_auth: ^3.0.1
  logger: ^2.4.0
  path_provider: ^2.1.4
  pedometer: ^4.0.2
  permission_handler: ^12.0.1
  sensors_plus: ^4.0.0
  sqflite_sqlcipher: ^3.4.0
  table_calendar: ^3.1.2
  timezone: ^0.9.4
  url_launcher: ^6.3.0
  uuid: ^4.4.0

dev_dependencies:
  bloc_test: ^9.1.7
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4

flutter:
