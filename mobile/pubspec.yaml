name: harmony
description: Application Harmony — filtrage d'appels, contrôle parental et fitness.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  cupertino_icons: ^1.0.8
  dio: ^5.5.0
  equatable: ^2.0.5
  fl_chart: ^0.66.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.0.0
  flutter_bloc: ^8.1.6
  flutter_secure_storage: ^9.2.2
  go_router: ^14.2.0
  google_fonts: ^6.2.1
  intl: ^0.20.1
  local_auth: ^2.2.0
  logger: ^2.4.0
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  sqflite_sqlcipher: ^2.2.0
  uuid: ^4.4.0

dev_dependencies:
  bloc_test: ^9.1.7
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  # Polices chargées via google_fonts à l'exécution — pas de fichiers locaux nécessaires
